<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#082f3e">
  <title>健康樂活與智慧醫療照護聯盟新知分享週報</title>
  <meta name="description" content="依週次瀏覽醫藥、照護、醫療科技與政策產業趨勢。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23082f3e'/%3E%3Cpath d='M18 32h10l4-11 6 22 4-11h8' fill='none' stroke='%235eead4' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#102a37;--muted:#627681;--line:#d8e3e6;--paper:#f3f7f7;--card:#fff;--deep:#082f3e;--teal:#0f766e;--mint:#ccfbf1;--amber:#f59e0b;--shadow:0 16px 45px rgba(8,47,62,.09)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.7}
    header{background:var(--deep);color:#fff;position:relative;overflow:hidden}header:after{content:"";position:absolute;width:420px;height:420px;border:80px solid rgba(94,234,212,.08);border-radius:50%;right:-150px;top:-250px}
    .head{max-width:1240px;margin:auto;padding:38px 28px 34px;display:flex;align-items:flex-end;justify-content:space-between;gap:32px;position:relative;z-index:1}.brand{display:flex;gap:16px;align-items:center}.mark{width:49px;height:49px;border-radius:14px;background:#0d4c5d;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}.mark svg{width:31px}.eyebrow{margin:0;color:#8eeade;font-size:.78rem;letter-spacing:.18em;font-weight:700}.brand h1{font-size:clamp(1.65rem,3vw,2.35rem);line-height:1.15;margin:4px 0 0;letter-spacing:.02em}.picker{min-width:280px}.picker label{display:block;color:#a9c6cc;font-size:.78rem;font-weight:700;margin-bottom:7px}.select-wrap{position:relative}.select-wrap:after{content:"⌄";position:absolute;right:16px;top:8px;color:#8eeade;font-size:1.3rem;pointer-events:none}.picker select{width:100%;appearance:none;background:#fff;color:var(--deep);border:0;border-radius:10px;padding:12px 42px 12px 15px;font:700 1rem inherit;box-shadow:0 8px 26px rgba(0,0,0,.15);cursor:pointer}
    main{max-width:1240px;margin:auto;padding:28px}.summary{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.period{font-size:1.25rem;font-weight:800;letter-spacing:.01em}.status{color:var(--muted);font-size:.86rem}.status:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-right:8px;vertical-align:1px}
    .layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:26px;align-items:start}.nav{position:sticky;top:24px;background:#e8f0f1;border-radius:15px;padding:9px}.nav button{width:100%;border:0;background:transparent;color:#49616c;padding:13px 14px;border-radius:10px;text-align:left;font:700 .93rem inherit;cursor:pointer;display:flex;gap:10px;align-items:center;transition:.18s}.nav button:hover{background:rgba(255,255,255,.65)}.nav button.active{background:#fff;color:var(--teal);box-shadow:0 4px 16px rgba(8,47,62,.08)}.nav .num{margin-left:auto;color:#8ca0a8;font-size:.75rem}.nav-note{padding:15px 14px 8px;color:#78909a;font-size:.77rem;line-height:1.55}
    .content{min-width:0}.section-head{display:flex;align-items:center;gap:12px;margin:2px 0 17px}.section-head h2{font-size:1.28rem;margin:0}.section-head span{font-size:.76rem;font-weight:800;letter-spacing:.08em;color:var(--teal);background:var(--mint);padding:3px 9px;border-radius:999px}.articles{display:grid;gap:16px}.article{background:var(--card);border:1px solid rgba(216,227,230,.9);border-radius:14px;padding:23px 24px;box-shadow:0 3px 15px rgba(8,47,62,.035);animation:rise .3s ease both}.article:hover{border-color:#afcacd;box-shadow:var(--shadow)}.article h3{font-size:1.04rem;line-height:1.55;margin:0 0 12px;color:#153a49}.article p{margin:0;color:#405861;white-space:pre-line}.article .source{display:block;margin-top:15px;padding-top:12px;border-top:1px solid #edf1f2;color:#758b94;font-size:.83rem}.empty,.error{background:#fff;border:1px solid var(--line);border-radius:14px;padding:40px;text-align:center;color:var(--muted)}.loading{display:grid;gap:14px}.skeleton{height:150px;border-radius:14px;background:linear-gradient(90deg,#e8eeee 25%,#f5f8f8 40%,#e8eeee 55%);background-size:300% 100%;animation:shine 1.2s infinite}
    footer{max-width:1240px;margin:20px auto 0;padding:22px 28px 36px;border-top:1px solid var(--line);color:#78909a;font-size:.78rem;display:flex;justify-content:space-between;gap:20px}footer a{color:var(--teal);text-decoration:none}
    @keyframes shine{to{background-position:-100% 0}}@keyframes rise{from{opacity:0;transform:translateY(6px)}}
    @media(max-width:760px){.head{padding:27px 20px 25px;display:block}.picker{margin-top:23px;min-width:0}.brand h1{font-size:1.7rem}main{padding:20px 16px}.summary{align-items:flex-start;display:block}.status{margin-top:3px}.layout{display:block}.nav{position:static;display:flex;overflow-x:auto;padding:7px;margin-bottom:20px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{width:auto;min-width:max-content}.nav .num,.nav-note{display:none}.article{padding:19px 18px}.section-head{margin-top:0}footer{padding:20px 16px 30px;display:block}footer span{display:block;margin-top:5px}}
  </style>
</head>
<body>
  <header><div class="head"><div class="brand"><div class="mark"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 33h16l6-17 9 34 7-17h10" fill="none" stroke="#5eead4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><p class="eyebrow">HEALTH INTELLIGENCE</p><h1>健康樂活與智慧醫療照護聯盟新知分享週報</h1></div></div><div class="picker"><label for="dateSelect">選擇報告日期</label><div class="select-wrap"><select id="dateSelect" aria-label="選擇報告日期"></select></div></div></div></header>
  <main><div class="summary"><div class="period" id="period">讀取資料中</div><div class="status" id="status">正在連線週報資料庫</div></div><div class="layout"><aside class="nav" id="categoryNav" aria-label="內容分類"></aside><section class="content"><div class="section-head"><h2 id="categoryTitle">本期內容</h2><span id="articleCount"></span></div><div id="articles" class="loading"><div class="skeleton"></div><div class="skeleton"></div></div></section></div></main>
  <footer><div>資料來源：健康樂活聯盟秘書處製作，內容正確性以原始資料來源為準；僅公開精簡版，完整為聯盟會員獨享</div><span>依所選日期顯示同列內容</span></footer>
  <script>
    const SHEET_CSV_URL='https://docs.google.com/spreadsheets/d/11glrsmWK80lsqagoqa5ESP6QkSRVu1EvFSGvQ26eemo/gviz/tq?tqx=out:csv&gid=15572406';
    const FALLBACK_DATA_URL='data.csv';
    const icons=['✚','◌','⌁','◎'];
    let records=[], headers=[], activeCategory=0;
    function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(quoted&&n==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows}
    function dateKey(s){const m=s.match(/(\d{4})年\s*(\d{1,2})月\s*(\d{1,2})/);return m?+`${m[1]}${m[2].padStart(2,'0')}${m[3].padStart(2,'0')}`:0}
    function splitItems(text){return (text||'').split(/(?=🔹)/g).map(s=>s.trim()).filter(Boolean)}
    function renderNav(){const nav=document.getElementById('categoryNav');const rec=records.find(r=>r[0]===dateSelect.value)||records[0];nav.innerHTML=headers.slice(1).map((h,i)=>`<button class="${i===activeCategory?'active':''}" data-i="${i}"><span>${icons[i]||'•'}</span>${escapeHTML(h)}<span class="num">${splitItems(rec?.[i+1]).length}</span></button>`).join('')+'<div class="nav-note">選擇分類查看該週的焦點摘要與來源。</div>';nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{activeCategory=+b.dataset.i;render()})}
    function extract(item){let t=item.replace(/^🔹\s*/,'').trim();let source='';const si=t.lastIndexOf('🔗');if(si>=0){source=t.slice(si).replace(/^🔗\s*/,'').trim();t=t.slice(0,si).trim()}const marker=t.search(/(?:✅\s*)?(?:提要|影響|意涵)[:：]/);let title,body;if(marker>0){title=t.slice(0,marker).replace(/✅\s*$/,'').trim();body=t.slice(marker).replace(/^✅\s*/,'').trim()}else{const nl=t.indexOf('\n');title=nl>0?t.slice(0,nl):t;body=nl>0?t.slice(nl+1):''}return{title,body,source}}
    function escapeHTML(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
    function render(){const rec=records.find(r=>r[0]===dateSelect.value)||records[0];if(!rec)return;document.getElementById('period').textContent=rec[0];document.getElementById('categoryTitle').textContent=headers[activeCategory+1];const items=splitItems(rec[activeCategory+1]);document.getElementById('articleCount').textContent=`${items.length} 則`;document.getElementById('articles').className='articles';document.getElementById('articles').innerHTML=items.length?items.map((raw,i)=>{const a=extract(raw);return `<article class="article" style="animation-delay:${i*.035}s"><h3>${escapeHTML(a.title)}</h3>${a.body?`<p>${escapeHTML(a.body)}</p>`:''}${a.source?`<span class="source">🔗 ${escapeHTML(a.source)}</span>`:''}</article>`}).join(''):'<div class="empty">此分類目前沒有內容</div>';renderNav()}
    async function loadData(){try{const live=await fetch(SHEET_CSV_URL,{cache:'no-store'});if(!live.ok)throw new Error('sheet');document.getElementById('status').textContent='即時同步，每週日更新';return await live.text()}catch(e){const backup=await fetch(FALLBACK_DATA_URL);if(!backup.ok)throw new Error('backup');document.getElementById('status').textContent='目前顯示備援資料';return await backup.text()}}
    async function init(){try{const rows=parseCSV(await loadData());headers=rows.shift().slice(0,5);records=rows.filter(r=>r[0]?.trim()).sort((a,b)=>dateKey(b[0])-dateKey(a[0]));dateSelect.innerHTML=records.map((r,i)=>`<option value="${escapeHTML(r[0])}" ${i===0?'selected':''}>${escapeHTML(r[0])}</option>`).join('');dateSelect.onchange=()=>{activeCategory=0;render()};render()}catch(e){document.getElementById('period').textContent='無法載入資料';document.getElementById('status').textContent='資料連線失敗';document.getElementById('articles').className='error';document.getElementById('articles').textContent='目前資料庫作業中，或稍後重新整理頁面。'}}init();
  </script>
</body>
</html>
